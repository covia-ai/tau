name: Installers

# Native installers with a bundled Java runtime, built by packaging/package.sh.
# Signing and notarisation run only when their secrets are configured; without
# them the installers are built unsigned, which suits testing but shows
# operating-system warnings on first launch.

on:
  push:
    # The integration branch runs too, so the installers are tested on the whole app before it merges.
    branches: [develop, master, feature/tau-stack, feature/e2e-platforms]
    tags: ['v*']
  pull_request:
    paths:
      - 'packaging/**'
      - '.github/workflows/installers.yml'
      - '.github/actions/**'
      - 'pom.xml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install Covia
        uses: ./.github/actions/install-covia

      - name: Build the jar
        shell: bash
        run: mvn -B -ntp package -DskipTests

      - name: Import the Developer ID certificate
        if: env.MACOS_CERTIFICATE_P12 != '' && env.MACOS_SIGNING_IDENTITY != ''
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          existing=()
          while IFS= read -r line; do existing+=("$line"); done < <(security list-keychains -d user | tr -d '" ')
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          rm -f "$RUNNER_TEMP/certificate.p12"
          echo "TAU_MAC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "TAU_MAC_SIGN_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Skip signing
        if: env.MACOS_CERTIFICATE_P12 == '' || env.MACOS_SIGNING_IDENTITY == ''
        shell: bash
        run: |
          echo "::notice::No Developer ID certificate configured: the dmg is unsigned."

      - name: Build the application image
        shell: bash
        run: packaging/package.sh image

      - name: Build the dmg
        shell: bash
        run: packaging/package.sh installer dmg

      - name: Notarise and staple
        if: env.TAU_MAC_SIGN_IDENTITY != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != ''
        shell: bash
        run: |
          set -euo pipefail
          for dmg in target/installer/*.dmg; do
            xcrun notarytool submit "$dmg" --wait \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done

      - name: Skip notarisation
        if: env.TAU_MAC_SIGN_IDENTITY == '' || env.APPLE_ID == '' || env.APPLE_TEAM_ID == '' || env.APPLE_APP_PASSWORD == ''
        shell: bash
        run: |
          echo "::notice::Signing or notarisation credentials missing: the dmg is not notarised."

      - name: Remove the signing keychain
        if: always() && env.TAU_MAC_KEYCHAIN != ''
        shell: bash
        run: security delete-keychain "$TAU_MAC_KEYCHAIN" || true

      # Installed as a person would, then the installed app's own launcher
      # proves the product works (packaging/e2e-installed.sh), and uninstalled.
      - name: Install, self-test and uninstall
        shell: bash
        run: packaging/e2e-installed.sh dmg target/installer/*.dmg

      - name: Keep the end-to-end evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-macos-${{ matrix.arch }}
          path: target/e2e/
          if-no-files-found: ignore
          retention-days: 14

      - name: Checksums
        shell: bash
        run: cd target/installer && shasum -a 256 -- *.dmg | tee SHA256SUMS-macos-${{ matrix.arch }}.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tau-macos-${{ matrix.arch }}
          path: target/installer/
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
            jdk: temurin
          # Temurin publishes no JDK 25 for Windows on ARM; Microsoft's build of OpenJDK does.
          - runner: windows-11-arm
            arch: arm64
            jdk: microsoft
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_TIMESTAMP_URL: http://timestamp.digicert.com
      WIX_VERSION: 5.0.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: ${{ matrix.jdk }}
          java-version: '25'
          cache: maven

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          $tools = Join-Path $env:USERPROFILE '.dotnet\tools'
          $tools >> $env:GITHUB_PATH
          $env:PATH = "$tools;$env:PATH"
          wix extension add -g WixToolset.Util.wixext/$env:WIX_VERSION WixToolset.UI.wixext/$env:WIX_VERSION
          wix --version

      - name: Install Covia
        uses: ./.github/actions/install-covia

      - name: Build the jar
        shell: bash
        run: mvn -B -ntp package -DskipTests

      - name: Build the application image
        shell: bash
        run: packaging/package.sh image

      - name: Prepare signing
        if: env.WINDOWS_CERTIFICATE_PFX != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'certificate.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          "TAU_SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
          "TAU_PFX=$pfx" >> $env:GITHUB_ENV

      - name: Skip signing
        if: env.WINDOWS_CERTIFICATE_PFX == ''
        shell: bash
        run: |
          echo "::notice::No code-signing certificate configured: the msi and Tau.exe are unsigned."

      # The launcher is signed inside the image before the MSI is made from
      # it, so both the installer and the program it installs carry the
      # signature.
      - name: Sign the launcher
        if: env.WINDOWS_CERTIFICATE_PFX != ''
        shell: pwsh
        run: |
          & $env:TAU_SIGNTOOL sign /fd SHA256 /td SHA256 /tr $env:WINDOWS_TIMESTAMP_URL `
            /f $env:TAU_PFX /p $env:WINDOWS_CERTIFICATE_PASSWORD target\jpackage\image\Tau\Tau.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the msi
        shell: bash
        run: packaging/package.sh installer msi

      - name: Sign the msi
        if: env.WINDOWS_CERTIFICATE_PFX != ''
        shell: pwsh
        run: |
          Get-ChildItem target\installer\*.msi | ForEach-Object {
            & $env:TAU_SIGNTOOL sign /fd SHA256 /td SHA256 /tr $env:WINDOWS_TIMESTAMP_URL `
              /f $env:TAU_PFX /p $env:WINDOWS_CERTIFICATE_PASSWORD $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Remove the certificate
        if: always() && env.TAU_PFX != ''
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue $env:TAU_PFX

      - name: Install, self-test and uninstall
        shell: pwsh
        run: |
          $msi = Get-ChildItem target\installer\*.msi | Select-Object -First 1
          ./packaging/e2e-installed.ps1 -Msi $msi.FullName

      - name: Keep the end-to-end evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-windows-${{ matrix.arch }}
          path: target/e2e/
          if-no-files-found: ignore
          retention-days: 14

      - name: Checksums
        shell: bash
        run: cd target/installer && sha256sum -- *.msi | tee SHA256SUMS-windows-${{ matrix.arch }}.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tau-windows-${{ matrix.arch }}
          path: target/installer/
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
            appimagetool: appimagetool-x86_64.AppImage
            appimagetool-sha256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          - runner: ubuntu-22.04-arm
            arch: arm64
            appimagetool: appimagetool-aarch64.AppImage
            appimagetool-sha256: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
    # The oldest supported runner, so the deb's computed dependencies and the
    # AppImage's launcher suit the widest range of distributions.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      APPIMAGETOOL_VERSION: 1.9.1
      APPIMAGETOOL_FILE: ${{ matrix.appimagetool }}
      APPIMAGETOOL_SHA256: ${{ matrix.appimagetool-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install packaging tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q fakeroot dpkg-dev desktop-file-utils
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/${APPIMAGETOOL_FILE}"
          echo "$APPIMAGETOOL_SHA256  $RUNNER_TEMP/appimagetool" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
          # Runners have no FUSE, so the tool runs from its extracted self.
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Install Covia
        uses: ./.github/actions/install-covia

      - name: Build the jar
        shell: bash
        run: mvn -B -ntp package -DskipTests

      - name: Build the application image
        shell: bash
        run: packaging/package.sh image

      - name: Build the deb
        shell: bash
        run: packaging/package.sh installer deb

      - name: Build the AppImage
        shell: bash
        run: |
          desktop-file-validate packaging/linux/tau.desktop
          packaging/package.sh appimage

      - name: Check the deb
        shell: bash
        run: |
          set -euo pipefail
          deb="$(ls target/installer/*.deb)"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          # Removing the package must never touch user data in ~/.tau: no
          # packaged path or maintainer script may refer to a home folder.
          mkdir -p "$RUNNER_TEMP/deb-control"
          dpkg-deb --control "$deb" "$RUNNER_TEMP/deb-control"
          # shellcheck disable=SC2016 # the patterns are literal text
          if dpkg-deb --contents "$deb" | grep -E '/home/|/root/' \
            || grep -rnE '\.tau|\$HOME|~/|/home/' "$RUNNER_TEMP/deb-control"; then
            echo "::error::The deb refers to a home folder"
            exit 1
          fi

      - name: Install the deb, self-test and uninstall
        shell: bash
        run: packaging/e2e-installed.sh deb target/installer/*.deb

      - name: Run the AppImage's self-test
        shell: bash
        run: E2E_DIR=target/e2e/appimage packaging/e2e-installed.sh appimage target/installer/*.AppImage

      - name: Keep the end-to-end evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-linux-${{ matrix.arch }}
          path: target/e2e/
          if-no-files-found: ignore
          retention-days: 14

      - name: Checksums
        shell: bash
        run: cd target/installer && sha256sum -- *.deb *.AppImage | tee SHA256SUMS-linux-${{ matrix.arch }}.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tau-linux-${{ matrix.arch }}
          path: target/installer/
          if-no-files-found: error
          retention-days: 14
