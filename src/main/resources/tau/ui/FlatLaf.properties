#
# Tau's UI defaults — loaded by FlatLaf after any theme's own files
# (see tau.ui.LAF, which registers this package as a custom defaults
# source), so everything here restyles whichever theme is chosen: FlatLaf's
# own, the IntelliJ pack's, or the owner's .theme.json. FlatLaf properties
# syntax: https://www.formdev.com/flatlaf/properties-files/
#
# [light] and [dark] prefix the values that differ between light and dark themes.
#


#---- accent ----
#
# @accentColor is not set here: tau.ui.LAF supplies it (Tau's own
# purple, or the one chosen in Settings → Theme) as a global extra default, and
# every accent-derived value below and in the theme — selection, focus, check
# marks, the default and primary buttons — follows it.


#---- semantic colours (read through tau.ui.components.Theme) ----
#
# Tau's own text colours, whatever the theme, read at WCAG AA (4.5:1) on the
# panel, on a card and on their own tint: tau.ui.LAF starts from the values
# here and moves each in lightness, hue kept, until it does. Secondary text
# starts from the theme's disabled text colour, which disabled controls keep.

Tau.muted = $Label.disabledForeground
Tau.error = #E55353
Tau.success = #3FB950
Tau.warning = #E58A3A

# Each tone's faint ground, behind a badge or a chip (tau.ui.components.Tone):
# a touch stronger on dark themes, where a translucent tint reads fainter.
# tau.ui.LAF fades one where its tone's text, moved as far as it goes, still
# would not read on it.
[dark]Tau.accent.tint = fade($Component.accentColor,18%)
[light]Tau.accent.tint = fade($Component.accentColor,14%)
[dark]Tau.success.tint = fade($Tau.success,18%)
[light]Tau.success.tint = fade($Tau.success,14%)
[dark]Tau.warning.tint = fade($Tau.warning,18%)
[light]Tau.warning.tint = fade($Tau.warning,14%)
[dark]Tau.error.tint = fade($Tau.error,18%)
[light]Tau.error.tint = fade($Tau.error,14%)
[dark]Tau.muted.tint = fade($Tau.muted,18%)
[light]Tau.muted.tint = fade($Tau.muted,14%)

# An elevated surface a step off the panel: assistant bubbles, cards, chips.
# tau.ui.LAF brings it back towards the panel where ordinary text would not
# read on it at AA; likewise the code background.
[dark]Tau.surface = tint(@background,12%)
[light]Tau.surface = shade(@background,6%)

# Behind code in rendered Markdown (inline and in blocks): a further step off
# the surface a bubble or card paints, so code reads as code without a frame.
[dark]Tau.code.background = tint(@background,24%)
[light]Tau.code.background = shade(@background,12%)

# The buttons' accent shades are derived in tau.ui.LAF from the resolved
# Component.accentColor once the theme is installed, and put into the defaults:
# a properties file cannot compute a contrast. Tau.accent.dark is the
# accent darkened until white reads on it (the user's bubbles' fill too);
# Tau.accent.text is the accent as text — links, headings, the tinted button —
# moved in lightness until it reads at AA on the panel, on a card and on its
# faint tint. From them: Tau.primary.background,
# .hoverBackground and .pressedBackground (the dark shade, a step either side)
# and Tau.tinted.foreground, .background, .hoverBackground and
# .pressedBackground (the accent text on a faint accent tint).
Tau.primary.foreground = #ffffff


#---- type ----
#
# Both faces are bundled (OFL) and registered by tau.ui.LAF, so they
# are identical on every platform: Lato for the UI, set as the default font
# there, and Inconsolata for the monospaced face — code in rendered Markdown,
# technical values, tool results. The first family in this list that is
# available is used, so the platform's own monospaced faces stand behind it
# rather than the JDK's logical Monospaced (Courier New on Windows).
monospaced.font = Inconsolata, Consolas, "Cascadia Mono", "SF Mono", Menlo, "JetBrains Mono", "DejaVu Sans Mono", "Noto Sans Mono", Monospaced


#---- geometry: rounded, 2020s, comfortably spaced ----

Component.arc = 14
Button.arc = 18
TextComponent.arc = 14
CheckBox.arc = 8
Component.focusWidth = 1
Component.innerFocusWidth = 1

# Slim, rounded, unobtrusive scrollbars.
ScrollBar.width = 12
ScrollBar.thumbArc = 999
ScrollBar.trackArc = 999
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.track = #00000000
ScrollPane.arc = 12

# Roomier menus and controls.
MenuItem.selectionArc = 8
Menu.selectionArc = 8
TitlePane.unifiedBackground = true
Button.default.boldText = true

# Navigation and list rows are tool-bar-style buttons (PressButton): the theme
# paints hover and pressed; the selected one — the active tab, the open agent or
# conversation — carries an accent tint, the tinted button's (tau.ui.LAF puts
# Tau.tinted.background here, faded where the accent text would not read).
Button.toolbar.selectedBackground = fade($Component.accentColor,22%)
ToggleButton.toolbar.selectedBackground = fade($Component.accentColor,22%)


#---- style classes (FlatLaf.styleClass; tau.ui.components.Styles) ----
#
# Type-independent, so they apply to labels, text areas and buttons alike, and
# combine ("small muted"). FlatLaf's own small/mini/medium/large/h1–h4/semibold/
# monospaced classes are available too.

[style].muted = foreground: $Tau.muted
[style].accent = foreground: $Tau.accent.text
[style].error = foreground: $Tau.error
[style].success = foreground: $Tau.success
[style].warning = foreground: $Tau.warning
# Relative sizes are scaled by FlatLaf's user scale factor (1.25 with the
# 15pt default font), so +7 reads as 24pt.
[style].strong = font: bold
[style].lead = font: bold +1
[style].section = font: bold +2
[style].title = font: bold +7
# A small capitalised label over a group (Labels.overline capitalises the text).
[style].overline = font: bold -2; foreground: $Tau.muted

# Bottom navigation: compact labels, readable on the selected accent tint.
[style].navigation = font: -3; foreground: $Tau.muted
[style].navigationActive = font: bold -3; foreground: $Tau.accent.text

# The one call to action on a screen (Save, Continue, Send): white on the
# accent's dark shade, so it reads at the same contrast whatever the accent.
[style]Button.primary = \
	buttonType: roundRect; \
	background: $Tau.primary.background; \
	foreground: $Tau.primary.foreground; \
	hoverBackground: $Tau.primary.hoverBackground; \
	pressedBackground: $Tau.primary.pressedBackground; \
	borderColor: $Tau.primary.background; \
	hoverBorderColor: $Tau.primary.hoverBackground; \
	pressedBorderColor: $Tau.primary.pressedBackground; \
	focusedBorderColor: $Component.accentColor; \
	font: bold

# The button that heads a list (+ Session, + Agent): the accent on
# its own faint tint — the navigation's selected look — so it reads as a way
# in, not as the screen's call to action. No border: the tint is the shape.
[style]Button.tinted = \
	buttonType: roundRect; \
	background: $Tau.tinted.background; \
	foreground: $Tau.tinted.foreground; \
	hoverBackground: $Tau.tinted.hoverBackground; \
	pressedBackground: $Tau.tinted.pressedBackground; \
	borderColor: fade($Component.accentColor,0%); \
	hoverBorderColor: fade($Component.accentColor,0%); \
	pressedBorderColor: fade($Component.accentColor,0%); \
	focusedBorderColor: $Component.accentColor; \
	font: bold

# A quiet secondary action (Back, Cancel, Copy): no chrome until hovered.
[style]Button.secondary = \
	buttonType: borderless; \
	foreground: $Tau.muted

# A drop-down that stays in the background (what a list shows): small, muted,
# and flat on the panel until opened.
[style]ComboBox.quiet = \
	font: -2; \
	foreground: $Tau.muted; \
	background: $Panel.background; \
	buttonBackground: $Panel.background; \
	borderColor: fade($Component.borderColor,0%)

# A link-like action in the accent, opening something or moving on. Untyped:
# it dresses a PressButton (a toggle button), whose toolbar type already
# supplies the quiet, borderless look.
[style].link = foreground: $Tau.accent.text

# Folder navigation uses the same quiet ground and accent tint as the other
# sidebar controls; all values follow the active theme.
[style]Tree.files = \
	background: $Panel.background; \
	selectionBackground: $Tau.tinted.background; \
	selectionForeground: $Tau.tinted.foreground; \
	selectionInactiveBackground: $Tau.tinted.background; \
	selectionInactiveForeground: $Tau.tinted.foreground; \
	selectionArc: 10; \
	selectionInsets: 0,4,0,4
