#
# Tau Light: the gold-ground system. Loaded after FlatLaf's light defaults and
# after tau/ui/FlatLaf.properties, so these values win. White content
# and cards, gold 100 for the sidebar, gold 200 for chrome and the Inbox
# panel, Gold 50 for hovered and selected rows, navy for all text, Royal
# Purple for primary buttons, active items and links, Cerulean for outlines,
# link underlines, focus and the active tab, grey for rules. Amber is for
# highlights and the waiting badge, and only navy text sits on it.
#

#---- grounds ----
@background = #FFFFFF
@foreground = #1E2642
@disabledForeground = #5A6072
@selectionBackground = #E9E1F7
@selectionForeground = #1E2642
@selectionInactiveBackground = #FDF6E7

Panel.background = #FFFFFF
Label.disabledForeground = #5A6072
Tau.surface = #FDF6E7
Tau.code.background = #FBEBC9
Tau.sidebar.background = #FBEBC9
Tau.sidebar.selectedBackground = #FFFFFF
Tau.sidebar.selectedBar = #6B46C1
Tau.chrome.background = #F8D99A
Tau.warmSurface = #FDF6E7
Tau.card.background = #FFFFFF
Tau.popover.background = #FFFFFF

TitlePane.background = #F8D99A
TitlePane.inactiveBackground = #FBEBC9
TitlePane.foreground = #1E2642
ToolBar.background = #F8D99A
PopupMenu.background = #FFFFFF
Popup.background = #FFFFFF
MenuBar.background = #F8D99A
ToolTip.background = #FFFFFF
ToolTip.foreground = #1E2642
List.background = #FFFFFF
Table.background = #FFFFFF
Tree.background = #FFFFFF
TextField.background = #FFFFFF
TextArea.background = #FFFFFF
TextPane.background = #FFFFFF
EditorPane.background = #FFFFFF
PasswordField.background = #FFFFFF
FormattedTextField.background = #FFFFFF
ComboBox.background = #FFFFFF
ComboBox.buttonBackground = #FFFFFF
Spinner.background = #FFFFFF
List.hoverBackground = #FDF6E7
Table.selectionInactiveBackground = #FDF6E7
# Selected rows in lists, tables and trees sit on Gold 50 with navy text, as
# hovered ones do; lists of sections and chats add the 3 px bar.
List.selectionBackground = #FDF6E7
List.selectionForeground = #1E2642
List.selectionInactiveBackground = #FDF6E7
List.selectionInactiveForeground = #1E2642
Table.selectionBackground = #FDF6E7
Table.selectionForeground = #1E2642
Table.selectionInactiveForeground = #1E2642
Tree.selectionBackground = #FDF6E7
Tree.selectionForeground = #1E2642
Tree.selectionInactiveBackground = #FDF6E7
Tree.selectionInactiveForeground = #1E2642

#---- rules and edges: grey rules, a firmer edge on controls ----
Separator.foreground = #E5E5E9
Component.borderColor = #C9CBD6
Component.disabledBorderColor = #E5E5E9
Table.gridColor = #E5E5E9

#---- focus, outline, link, tabs ----
Component.focusColor = #4A90E2
Component.focusedBorderColor = #4A90E2
Tau.link = #6B46C1
Tau.link.underline = #4A90E2
Component.linkColor = #6B46C1
TabbedPane.underlineColor = #4A90E2
TabbedPane.inactiveUnderlineColor = #C9CBD6
TabbedPane.selectedForeground = #1E2642

#---- roles ----
Tau.localNode = #6B46C1
Tau.yours = #F2AE30
Tau.countPill.background = #1E2642
Tau.countPill.foreground = #F2AE30

#---- semantic ----
Tau.success = #1A7F37
Tau.warning = #A9561B
Tau.error = #C62828
Tau.verified = #2F6FB8
Tau.public = #2F6FB8
